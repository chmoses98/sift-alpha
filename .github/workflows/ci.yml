name: Alpha research desk CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: alpha-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-desk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research director and fail-closed quality tests
        run: python3 -m unittest discover -s tests -p 'test_engine*.py' -v
      - name: Verify director produces only a planning artifact
        run: python3 -m alpha_engine.cli > /tmp/alpha-plan.json
      - name: Production build
        run: npm run build
