name: CLV canonical tests
on:
  pull_request:
    paths: ['sift_clv/**', 'tests/test_clv_*.py', 'scripts/recalc_*.py', '.github/workflows/clv-canonical-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_clv_*.py' -v
