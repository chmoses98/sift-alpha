name: Dashboard e2e (Playwright desktop Chrome + iPhone WebKit)

# Runs the existing tests/*.spec.mjs suite (it previously ran nowhere in CI) against the Vite dev server in real Chromium (desktop) and WebKit (iPhone 13, 390px).
# Read-only: no deploy, no secrets, no network calls beyond installing browsers.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'research/audit/input_research/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.mjs'
      - 'vite.config.mjs'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
