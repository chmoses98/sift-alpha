name: ESPN payload probe (read-only, probe branch only)
on:
  push:
    branches: ['probe/espn-payloads']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/probe/probe_espn.py
