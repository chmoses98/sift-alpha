name: Source field probe (read-only, probe branch only)
on:
  push:
    branches: ['probe/field-probe']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/probe/field_probe.py out | tee out.txt || true
      - name: publish data branch
        if: always()
        run: |
          mkdir -p out && cp out.txt out/console.txt 2>/dev/null || true
          git config user.name "sift-alpha-probe"; git config user.email "probe@users.noreply.github.com"
          git checkout --orphan field-probe-data
          git rm -rf -q . || true
          git add -f out && git commit -qm "field probe ${GITHUB_RUN_ID}" && git push -f origin field-probe-data
