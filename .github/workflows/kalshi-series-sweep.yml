name: Kalshi series sweep (manual, public reads)
# Manual only (workflow_dispatch). Unauthenticated public market-data GETs: no secrets, no trading, no paid service.
# Bounded: request budget per run, per-request interval, Retry-After backoff, 30-minute timeout.
# Resumable: state is restored from the newest cache for the same queue and re-saved; each run also uploads the state.
# Run again until the log says "complete".  One run at a time (concurrency group).
on:
  workflow_dispatch:
    inputs:
      queue:
        description: "Queue file under kalshi_sweep/queues/"
        type: choice
        options:
          - mlb_queue.json
          - soccer_ambiguous_queue.json
        default: mlb_queue.json
      max_requests:
        description: "Request budget for this run (1-1000)"
        type: number
        default: 400
permissions:
  contents: read
concurrency:
  group: kalshi-series-sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QUEUE: ${{ inputs.queue }}
      MAX_REQUESTS: ${{ inputs.max_requests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: sweep_state.json
          key: sweep-state-${{ inputs.queue }}-${{ github.run_id }}
          restore-keys: sweep-state-${{ inputs.queue }}-
      - name: Sweep (exit 3 = budget/rate-limit stop; dispatch again to resume)
        run: |
          set +e
          python3 -m kalshi_sweep.series_sweep "kalshi_sweep/queues/$QUEUE" sweep_state.json --max-requests "$MAX_REQUESTS" --min-interval 0.3
          rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
      - name: Dump compact state to the job log (convenience only; the data branch is the durable transport)
        if: always()
        run: test -f sweep_state.json && python3 -m kalshi_sweep.dump_state sweep_state.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-state-${{ inputs.queue }}
          path: sweep_state.json
  publish:
    # Durable, git-readable transport: raw state + provenance manifest committed to the `sweep-data` branch ONLY.
    # Only this job has write permission; it runs after a successful sweep and never touches any other ref.
    needs: sweep
    # Write access only for runs of the default branch: a dispatch on any other ref can never publish.
    if: ${{ needs.sweep.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      QUEUE: ${{ inputs.queue }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: sweep-state-${{ inputs.queue }}
          path: state
      - name: Check out (or create) the sweep-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Token-derived header is masked and passed to git through process-local GIT_CONFIG_* env only:
          # nothing is written to the remote URL, .git/config, ~/.gitconfig or any credential file.
          B64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$B64"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $B64"
          rm -rf data && mkdir data && cd data
          git init -q
          git remote add origin "https://github.com/${REPO}.git"
          if git fetch -q --depth=1 origin sweep-data; then git checkout -q -B sweep-data FETCH_HEAD; else git checkout -q --orphan sweep-data; fi
      - name: Publish raw state with provenance
        working-directory: code
        run: python3 -m kalshi_sweep.publish ../state/sweep_state.json "kalshi_sweep/queues/$QUEUE" ../data
      - name: Commit to sweep-data only
        working-directory: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          B64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$B64"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $B64"
          git config user.name "sift-alpha sweep"; git config user.email "sweep@users.noreply.github.com"
          git add -A && git commit -q -m "sweep: ${QUEUE} run ${GITHUB_RUN_ID}"
          for i in 1 2 3; do git push -q origin HEAD:refs/heads/sweep-data && exit 0; git fetch -q --depth=1 origin sweep-data && git rebase -q FETCH_HEAD || true; done
          exit 1
