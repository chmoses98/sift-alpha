name: Kalshi sweep tests
on:
  pull_request:
    paths: ['kalshi_sweep/**', 'tests/test_kalshi_sweep.py', 'tests/test_publish_flow.py', '.github/workflows/kalshi-series-sweep.yml', '.github/workflows/kalshi-sweep-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pyyaml
      - run: python3 -m unittest discover -s tests -p 'test_kalshi_sweep.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_publish_flow.py' -v
