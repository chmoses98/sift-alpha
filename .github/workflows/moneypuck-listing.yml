# MANUAL ONLY: one GET of the public MoneyPuck data page to record which downloads are actually listed. No key, no schedule, no data download.
name: MoneyPuck listing (manual)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m alpha_engine.collect.moneypuck listing --out "$RUNNER_TEMP/listing.json" && cat "$RUNNER_TEMP/listing.json"
      - uses: actions/upload-artifact@v4
        with: {name: moneypuck-listing, path: "${{ runner.temp }}/listing.json", retention-days: 14}
