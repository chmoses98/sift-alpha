name: NBA starters live check (research, read-only)
# Runs nba-edge-finder's PR #87 pre-tip starter capture (public repo, branch feat/starters-live-verification-20261104) against LIVE ESPN
# from THIS repository's runners, polling for a bounded period across the evening tip window, and prints measured coverage by minutes
# before tip. Nothing is projected, pushed or written back. Trigger: workflow_dispatch or a push touching .trigger-nba-starters.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to poll"
        default: "280"
  push:
    paths:
      - ".trigger-nba-starters"
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chmoses98/nba-edge-finder
          ref: feat/starters-live-verification-20261104
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Poll ESPN core rosters inside the pre-tip window
        env:
          MINUTES: ${{ inputs.minutes || '280' }}
        run: |
          case "$MINUTES" in (*[!0-9]*|"") echo "minutes must be an integer" >&2; exit 1;; esac
          git rev-parse HEAD
          python scripts/starters_live_check.py --archive "$RUNNER_TEMP/archive" --minutes "$MINUTES" --interval-min 4
      - name: Shipped CLI coverage report
        if: always()
        run: nba starters-coverage --archive "$RUNNER_TEMP/archive" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-starters-live-${{ github.run_id }}
          path: ${{ runner.temp }}/archive
          retention-days: 30
