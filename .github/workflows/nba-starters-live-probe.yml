name: NBA starters live probe (probe branch only)
on:
  workflow_dispatch:
  push:
    branches: ['probe/nba-starters-live']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chmoses98/nba-edge-finder
          ref: 5fc63c3cffee2b875d40945754654593392def84
          path: nba
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -e nba
      - name: poll starters (3-min cadence from T-125 min of the first tip)
        run: |
          mkdir -p out
          python tools/probe/nba_starters_poll.py out 180 4.5 | tee out/console.txt
      - name: publish data branch
        if: always()
        run: |
          git config user.name "sift-alpha-probe"; git config user.email "probe@users.noreply.github.com"
          git checkout --orphan nba-starters-probe-data
          git rm -rf -q . || true
          git add -f out && git commit -qm "nba starters probe ${GITHUB_RUN_ID}" && git push -f origin nba-starters-probe-data
