name: NFL totals prospective quote capture (research-only, no orders)

# Captures the open KXNFLTOTAL quotes from Kalshi's PUBLIC read-only market endpoint around the pre-registered decision times (kickoff-6h / -90min) and uploads the snapshot as an
# artifact.  No credentials, no order endpoints, no commits.  A late or skipped run simply fails the pre-registered freshness rule for that game; it never invents a quote.
# Ingest the artifacts with:  python -m alpha_engine.lab.prospective ingest --snapshots DIR --dir research/prospective/nfl_totals_v1
on:
  schedule:
    - cron: '*/30 11-23 * * 0'      # Sunday windows (UTC)
    - cron: '*/30 0-4 * * 1'        # Sunday-night window rolls into Monday UTC
    - cron: '*/30 12-23 * * 1'      # Monday-night game
    - cron: '*/30 12-23,0-3 * * 4'  # Thursday-night game
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-prospective-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - name: Fetch current schedule (free nflverse asset)
        run: curl -fsSL -o "$RUNNER_TEMP/games.csv" https://github.com/nflverse/nflverse-data/releases/download/schedules/games.csv
      - name: Capture quotes
        run: python -m alpha_engine.lab.prospective capture --games "$RUNNER_TEMP/games.csv" --out "$RUNNER_TEMP/snap"
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-prospective-quotes-${{ github.run_id }}
          path: ${{ runner.temp }}/snap/
          retention-days: 90
