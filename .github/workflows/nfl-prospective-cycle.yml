name: NFL totals prospective cycle (research-only, no orders)

# Frozen nfl_totals_v1 experiment.  One cycle = refresh free nflverse data -> verify the frozen model still reproduces its 2014-2025 predictions -> append new time-stamped
# predictions -> ingest the verified Kalshi collector's snapshots from `market-data` (read-only) -> evaluate with the pre-registered claim gate -> publish APPEND-ONLY to the
# `prospective-data` branch (a push is refused if any existing ledger line would change).  A fail-closed public-REST capture runs first as a second, independent quote source.
# No credentials, no order endpoints, no trading authority.  Missed captures are reported as gaps; they are never reconstructed.
#
# IMPORTANT: GitHub starts cron runs hours late under load and only runs schedules from the DEFAULT branch, so this workflow is inert until merged and its freshness is whatever the
# collector achieves.  Every decision's actual observation age is recorded and enforced (<= 30 min) -- a late run costs eligibility, never validity.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write          # ONLY to append to the prospective-data branch (publish refuses non-append-only changes)

concurrency:
  group: nfl-prospective-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the complete dependency set
        run: pip install numpy pandas scipy scikit-learn pyarrow pytest pyyaml
      - name: Offline tests (includes the capture CLI against a mocked API, ingestion, gate, append-only publish)
        run: python -m pytest tests/test_prospective.py -q
      - name: Fetch the verified collector's data (read-only, blobs on demand) and the ledgers already published
        run: |
          git fetch --depth=1 --filter=blob:none origin market-data
          git branch -f market-data FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/pv"
          cp research/prospective/nfl_totals_v1/FREEZE.json research/prospective/nfl_totals_v1/FREEZE_DIGEST.json "$RUNNER_TEMP/pv/"
          if git fetch --depth=1 origin prospective-data; then
            for f in predictions quotes observations capture_failures; do git show "FETCH_HEAD:nfl_totals_v1/$f.jsonl" > "$RUNNER_TEMP/pv/$f.jsonl" 2>/dev/null || rm -f "$RUNNER_TEMP/pv/$f.jsonl"; done
          else
            cp research/prospective/nfl_totals_v1/*.jsonl "$RUNNER_TEMP/pv/"      # first run seeds the branch from the frozen ledgers committed with the PR
          fi
      - name: Fail-closed public-REST capture (second quote source; failure is recorded, never fatal to the cycle)
        continue-on-error: true
        run: |
          curl -fsSL -o "$RUNNER_TEMP/games.csv" https://github.com/nflverse/nflverse-data/releases/download/schedules/games.csv
          python -m alpha_engine.lab.prospective capture --games "$RUNNER_TEMP/games.csv" --dir "$RUNNER_TEMP/pv"
      - name: Cycle (refresh, frozen-model check, predict, ingest, evaluate)
        run: |
          python -m alpha_engine.lab.prospective cycle --data-dir "$RUNNER_TEMP/nflverse" --md-repo "$GITHUB_WORKSPACE" --md-ref market-data --dir "$RUNNER_TEMP/pv" --work "$RUNNER_TEMP/work"
      - name: Publish append-only
        run: |
          python -m alpha_engine.lab.prospective publish --repo "$GITHUB_WORKSPACE" --dir "$RUNNER_TEMP/pv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-prospective-report-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pv/REPORT.json
            ${{ runner.temp }}/pv/decision_audit.json
          retention-days: 30
