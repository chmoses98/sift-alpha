name: SIFT projection feed (read-only JSON)

# Rebuilds feed/v1/*.json (sift_feed/, schema v1) from each sport's PUBLIC production artifact and
# force-pushes it, as a single commit, to the orphan branch `projection-feed`: the only thing it writes.
# No secrets beyond the workflow token, no orders, no paid services, no sport repository is modified.
#
# It has NO schedule of its own. It runs
#   (a) on manual dispatch, or
#   (b) after each run of the existing 6-hourly "Publish SIFT Alpha research dashboard" workflow,
#       ONLY when the owner sets the repository variable SIFT_FEED_AUTOPUBLISH=true (otherwise the job
#       is skipped).
# workflow_dispatch and workflow_run only fire for workflow files on the default branch, so nothing
# here can run before this file is merged.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish SIFT Alpha research dashboard"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: projection-feed
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.SIFT_FEED_AUTOPUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Feed tests (offline, recorded fixtures)
        run: pip install -q pytest && python -m pytest -q tests/test_sift_feed.py
      - name: Build the feed from the public production branches (blobless, depth 1)
        run: python -m sift_feed.build --mode remote --cache "$RUNNER_TEMP/feedcache" --out "$RUNNER_TEMP/out/feed/v1"
      - name: Consumer check (reads only the built index.json)
        run: |
          for t in Celtics Bruins Texans Duke; do python -m sift_feed.say "$t" --index "$RUNNER_TEMP/out/feed/v1/index.json" || true; done
      - name: Publish to projection-feed (orphan branch, one commit, force-push)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp feed/README.md "$RUNNER_TEMP/out/feed/README.md"
          cd "$RUNNER_TEMP/out"
          git init -q && git checkout -q --orphan projection-feed
          git add feed
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "projection feed $(date -u +%Y-%m-%dT%H:%M:%SZ) (source ${GITHUB_SHA::12})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/projection-feed
          echo "### Projection feed published: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/projection-feed/feed/v1/index.json" >> "$GITHUB_STEP_SUMMARY"
