name: Outcome/execution research tests
on:
  pull_request:
    paths: ['sift_research/**', 'sift_exec/**', 'sift_clv/**', 'research/**', 'tests/**', 'docs/**', '.github/workflows/research-tests.yml']
  push:
    branches: [main]
    paths: ['sift_research/**', 'sift_exec/**', 'research/**', 'tests/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyyaml pytest scikit-learn
      - name: Full unit suite (research-only code; no network, no credentials)
        run: python3 -W ignore -m unittest discover -s tests -p 'test_*.py'
