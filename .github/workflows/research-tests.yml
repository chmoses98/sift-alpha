name: Outcome/execution research tests
on:
  pull_request:
    paths: ['sift_research/**', 'research/outcome_exec/**', 'tests/test_research_*.py', '.github/workflows/research-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - run: python3 -m unittest discover -s tests -p 'test_research_*.py' -v
