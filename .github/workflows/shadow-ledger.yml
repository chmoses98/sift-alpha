name: Shadow-order ledger (research-only, hypothetical, no orders)

# CONDUCTOR: one runner loops every 10 minutes for ~5h35m (successor dispatched first, hourly cron as backstop), because a 30-minute cron is best-effort and lags,
# and a decision only counts as PROSPECTIVE when it is recorded within 30 minutes of its quote. Each pass: sync new live-capture runs from nfl-edge-finder market-data
# (public, read-only), record point-in-time PLACED snapshots for every matched tactic, append fill evidence and SETTLED rows after each deadline, VALIDATE the output
# (a green job without valid output is not success) and publish to the `shadow-data` branch with a confirmed push. Nothing here can place an order: no credentials, GET-only reads.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: "how long this link loops (max 335)"
        required: false
        default: "335"

permissions:
  contents: write
  actions: write

concurrency:
  group: shadow-ledger
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - name: Dispatch the successor link (a refused dispatch leaves the hourly cron as backstop)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run shadow-ledger.yml --ref main && echo "successor dispatched"
      - name: Restore ledger + extract from shadow-data
        run: |
          git fetch --depth=1 origin shadow-data || true
          mkdir -p shadow_data
          if git rev-parse --verify origin/shadow-data >/dev/null 2>&1; then git --work-tree=shadow_data checkout origin/shadow-data -- . ; git reset -q; fi
          ls shadow_data | head
      - name: Loop sync + build + validate + publish (every 10 minutes)
        env:
          MINUTES: ${{ inputs.minutes || '335' }}
        run: |
          set -uo pipefail
          case "${MINUTES}" in ''|*[!0-9]*) echo "::error::bad minutes"; exit 1;; esac
          [ "${MINUTES}" -le 335 ] || { echo "::error::minutes > 335"; exit 1; }
          git config --global user.name "github-actions[bot]"; git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/md && mkdir /tmp/md && ( cd /tmp/md && git init -q . && git remote add origin https://github.com/chmoses98/nfl-edge-finder )
          END=$(( $(date +%s) + MINUTES * 60 ))
          PASS=0
          while [ "$(date +%s)" -lt "${END}" ]; do
            START=$(date +%s); PASS=$((PASS+1))
            ( cd /tmp/md && git fetch -q --depth=1 --filter=blob:none origin market-data ) || { echo "::warning::market-data fetch failed (pass ${PASS})"; sleep 60; continue; }
            python3 research/exec_track/shadow_sync.py --clone /tmp/md --extract-dir shadow_data/extract --since-days 2 --max-runs 400 || { echo "::error::sync failed"; exit 1; }
            curl -fsSL https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv -o /tmp/games.csv || true
            python3 research/exec_track/shadow_ledger.py --ext shadow_data/extract --ledger shadow_data/nfl_2026.jsonl --games /tmp/games.csv || { echo "::error::ledger build failed"; exit 1; }
            python3 research/exec_track/shadow_report.py --ledger shadow_data/nfl_2026.jsonl --out shadow_data/summary.json || exit 1
            python3 research/exec_track/validate_shadow_output.py --ledger shadow_data/nfl_2026.jsonl --state shadow_data/extract/state.json \
              --health shadow_data/health.json --runs shadow_data/runs.jsonl --append-run || { echo "::error::output failed validation; NOT publishing"; exit 1; }
            rm -rf /tmp/pub && mkdir /tmp/pub && cp -r shadow_data/. /tmp/pub/
            ( cd /tmp/pub && git init -q . && git checkout -q -b shadow-data && git add -A && git commit -q -m "shadow ledger pass ${PASS} $(date -u +%FT%TZ)" \
              && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" && git push -q --force origin shadow-data \
              && [ "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/shadow-data | cut -f1)" ] ) \
              && echo "pass ${PASS} published $(date -u +%T)" || { echo "::error::publish not confirmed (pass ${PASS})"; exit 1; }
            ELAPSED=$(( $(date +%s) - START )); [ "${ELAPSED}" -lt 600 ] && sleep $(( 600 - ELAPSED ))
          done
