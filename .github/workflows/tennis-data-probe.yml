name: Tennis-data.co.uk probe (probe branch only)
on:
  push:
    branches: ['probe/tennis-data']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q openpyxl
      - name: probe (derived statistics only; no raw rows are published)
        run: |
          mkdir -p out
          python tools/probe/tennis_data_probe.py 2026 | tee out/console.txt
      - name: publish data branch
        if: always()
        run: |
          git config user.name "sift-alpha-probe"; git config user.email "probe@users.noreply.github.com"
          git checkout --orphan tennis-data-probe-data
          git rm -rf -q . || true
          git add -f out && git commit -qm "tennis-data probe ${GITHUB_RUN_ID}" && git push -f origin tennis-data-probe-data
